<html lang="en"><head><meta charset="utf-8"><title>THE 1ST THROW — animatic</title>

<body><svg id="s" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"></svg>
<script>
// THE 1ST THROW — 90 s animatic. Pure seek(t): no timers, no CSS transitions, no random.
window.VIDEO = { w: 1920, h: 1080, duration: 90 };
const S = document.getElementById('s');
const GY = 860, X0 = 1000, SW = 1.8, SC = 3.4, GYC = 840, CX = 960;
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const sm = v => { v = cl(v); return v * v * (3 - 2 * v); };
const eo = v => 1 - Math.pow(1 - cl(v), 3), ei = v => Math.pow(cl(v), 2.2);
const f = n => n.toFixed(1);

// ---------- props ----------
const COL = { bagBig: '#34363b', bagSmall: '#5f7283', cup: '#c4574a', carton: '#bfa070', wrapper: '#e3b54f', bottle: '#80b5ab' };
const H_ITEM = { bagBig: 100, bagSmall: 70, cup: 56, carton: 50, wrapper: 22, bottle: 22 };
function bag(c, k) {
  return `<g transform="scale(${k})"><path d="M-46 0C-58 -40 -40 -78 -10 -80L-14 -90L-4 -86L0 -100L4 -86L14 -90L10 -80C40 -78 58 -40 46 0Z" fill="${c}"/><ellipse cx="-18" cy="-44" rx="9" ry="20" fill="#fff" opacity=".13" transform="rotate(18 -18 -44)"/></g>`;
}
function item(type) {
  const c = COL[type];
  if (type === 'bagBig') return bag(c, 1);
  if (type === 'bagSmall') return bag(c, .7);
  if (type === 'cup') return `<path d="M-20 0L-26 -52L26 -52L20 0Z" fill="${c}"/><rect x="-29" y="-58" width="58" height="8" rx="3" fill="#a4443a"/><rect x="-6" y="-80" width="5" height="26" fill="#eee" transform="rotate(8)"/>`;
  if (type === 'carton') return `<rect x="-34" y="-50" width="68" height="50" rx="3" fill="${c}"/><path d="M-34 -50L-24 -60L24 -60L34 -50Z" fill="#a98a5c"/><rect x="-20" y="-34" width="40" height="8" fill="#e8dcc0"/>`;
  if (type === 'wrapper') return `<path d="M-30 0L-22 -18L-6 -12L8 -22L26 -10L32 0Z" fill="${c}"/>`;
  if (type === 'bottle') return `<rect x="-37" y="-22" width="60" height="22" rx="10" fill="${c}" opacity=".92"/><rect x="21" y="-17" width="16" height="12" rx="3" fill="${c}"/><rect x="36" y="-18" width="7" height="14" rx="2" fill="#4a6d66"/>`;
}
// dx right, dy up (pile units), rot = resting angle
const ITEMS = [
  { type: 'bagBig', dx: 0, dy: 0, rot: 0 }, { type: 'bagSmall', dx: 85, dy: 4, rot: 8 }, { type: 'cup', dx: -90, dy: 6, rot: -78 },
  { type: 'carton', dx: 150, dy: 3, rot: -6 }, { type: 'wrapper', dx: -155, dy: 8, rot: 0 }, { type: 'bagSmall', dx: -40, dy: 46, rot: -10 },
  { type: 'bottle', dx: 35, dy: 70, rot: 4 }, { type: 'carton', dx: -115, dy: 30, rot: 10 }, { type: 'bagBig', dx: 5, dy: 85, rot: 6 },
];

// ---------- close-up scenes (hand = WHAT) ----------
const FALL = 0.3;
// close-up windows: a..b global time, idx = item dropped, desc = hand descent time, hes = hesitation before release
const CLOSES = [
  { a: 12,   b: 15,   idx: 0, desc: .55, hes: .30, shirt: '#2f4a6b', skin: '#e0b48f' },
  { a: 28,   b: 32,   idx: 1, desc: .55, hes: .90, shirt: '#b5483f', skin: '#c68a62' },
  { a: 39,   b: 43,   idx: 2, desc: .50, hes: .25, shirt: '#e0b43a', skin: '#e8c3a0' },
  { a: 44.9, b: 46.4, idx: 3, desc: .30, hes: .12, shirt: '#4d8a5e', skin: '#d9a97f' },
  { a: 48.2, b: 49.6, idx: 4, desc: .30, hes: .10, shirt: '#7b5aa6', skin: '#b87f58' },
  { a: 51.2, b: 52.4, idx: 5, desc: .28, hes: .08, shirt: '#d98a3d', skin: '#e8c3a0' },
  { a: 53.8, b: 54.8, idx: 6, desc: .25, hes: .05, shirt: '#7d8590', skin: '#c68a62' },
  { a: 56.1, b: 57.0, idx: 7, desc: .22, hes: .03, shirt: '#3f8f93', skin: '#d9a97f' },
  { a: 61,   b: 64,   idx: 8, desc: .40, hes: .00, shirt: '#2e6f73', skin: '#d9a97f' },
];
CLOSES.forEach(c => { c.tr = c.a + c.desc + c.hes; c.land = c.tr + FALL; });
// reversed close-ups (scene 12): same function, time mapped backwards
const REV = [ { a: 79.4, b: 81.2, src: 2 }, { a: 82.0, b: 83.8, src: 0 } ];

// ---------- people (wide = WHO) ----------
const LSTOP = 800, RSTOP = 1200;
const SPEC = {
  p1: { h: 1.0,  bw: 92,  shirt: '#2f4a6b', pants: '#8a7b66', skin: '#e0b48f', hair: 'short', hc: '#2b2420', item: 'bagBig' },
  p2: { h: .9,   bw: 118, shirt: '#b5483f', pants: '#3d3f45', skin: '#c68a62', hair: 'hood',  hc: '#8f362f', item: 'bagSmall' },
  p3: { h: 1.12, bw: 76,  shirt: '#e0b43a', pants: '#51607a', skin: '#e8c3a0', hair: 'cap',   hc: '#3a3a3a', item: 'cup' },
  p4: { h: .98,  bw: 90,  shirt: '#4d8a5e', pants: '#4a4036', skin: '#d9a97f', hair: 'long',  hc: '#2a1d16', item: 'carton' },
  p5: { h: 1.05, bw: 128, shirt: '#7b5aa6', pants: '#2f3138', skin: '#b87f58', hair: 'short', hc: '#1f1a18', item: 'wrapper' },
  p6: { h: .84,  bw: 84,  shirt: '#d98a3d', pants: '#6a5c4a', skin: '#e8c3a0', hair: 'cap',   hc: '#a2622a', item: 'bagSmall' },
  p7: { h: 1.15, bw: 70,  shirt: '#7d8590', pants: '#33363b', skin: '#c68a62', hair: 'long',  hc: '#5a4a3a', item: 'bottle' },
  p8: { h: .95,  bw: 100, shirt: '#b8c0a0', pants: '#5a4a6a', skin: '#d9a97f', hair: 'hood',  hc: '#7a8468', item: 'carton' },
  p9: { h: 1.02, bw: 96,  shirt: '#2e6f73', pants: '#44403a', skin: '#d9a97f', hair: 'short', hc: '#222', item: 'bagBig' },
};
// mode: arrive | leave | hold. startX lets montage people already be mid-stride after a time jump.
const SEGS = [
  { a: 6,    b: 12,  sp: 'p1', side: 'L', mode: 'arrive', ta: 3.2, slow: .1, carry: 1, tiltAt: 10.0, tiltDur: 2, notice: 0 },
  { a: 15,   b: 21,  sp: 'p1', side: 'L', mode: 'leave',  dly: .9, carry: 0 },
  { a: 21,   b: 28,  sp: 'p2', side: 'R', mode: 'arrive', ta: 3.0, slow: 1.4, carry: 1, tiltAt: 23.7, tiltDur: 4, notice: 1 },
  { a: 32,   b: 39,  sp: 'p2', side: 'R', mode: 'leave',  dly: .5, carry: 0 },
  { a: 34.6, b: 39,  sp: 'p3', side: 'L', mode: 'arrive', ta: 2.8, slow: .3, carry: 1, tiltAt: 37.3, tiltDur: .9, notice: .5 },
  { a: 43,   b: 44.9, sp: 'p4', side: 'L', mode: 'arrive', ta: 1.6, slow: 0, carry: 1, startX: 380, tiltAt: 44.3, tiltDur: .3, notice: .2 },
  { a: 46.4, b: 48.2, sp: 'p5', side: 'R', mode: 'arrive', ta: 1.5, slow: 0, carry: 1, startX: 1580, tiltAt: 47.7, tiltDur: .2, notice: .1 },
  { a: 49.6, b: 51.2, sp: 'p6', side: 'L', mode: 'arrive', ta: 1.3, slow: 0, carry: 1, startX: 470, tiltAt: 50.9, tiltDur: .1, notice: 0 },
  { a: 52.4, b: 53.8, sp: 'p7', side: 'R', mode: 'arrive', ta: 1.15, slow: 0, carry: 1, startX: 1540, tiltAt: 99, tiltDur: 0, notice: 0 },
  { a: 54.8, b: 56.1, sp: 'p8', side: 'L', mode: 'arrive', ta: 1.05, slow: 0, carry: 1, startX: 520, tiltAt: 99, tiltDur: 0, notice: 0 },
  { a: 57,   b: 61,  sp: 'p9', side: 'R', mode: 'arrive', ta: 3.4, slow: 0, carry: 1, tiltAt: 99, tiltDur: 0, notice: 0 },
  { a: 64,   b: 67,  sp: 'p9', side: 'R', mode: 'leave',  dly: .25, carry: 0, nolook: 1 },
  { a: 83.8, b: 87.0, sp: 'p1', side: 'L', mode: 'hold', carry: 1 },
];
const SPEED = 300, STRIDE = 44;
function personState(g, t) {
  const stop = g.side === 'L' ? LSTOP : RSTOP, s = SPEC[g.sp];
  let x, dir = g.side === 'L' ? 1 : -1, walk = 0, ph = 0, tilt = 0, arm = 0;
  if (g.mode === 'arrive') {
    const x0 = g.startX ?? (g.side === 'L' ? -170 : 2090);
    const u = cl((t - g.a) / g.ta), e = 1 - Math.pow(1 - u, 1 + g.slow);
    x = x0 + (stop - x0) * e;
    const x2 = x0 + (stop - x0) * (1 - Math.pow(1 - cl(u + .01), 1 + g.slow));
    walk = u < 1 ? cl(Math.abs(x2 - x) / (g.ta * .01) / 180) : 0;
    ph = Math.abs(x - x0) / STRIDE;
    const k = t - g.tiltAt; tilt = sm(k / .35) * (1 - sm((k - g.tiltDur) / .35));
  } else if (g.mode === 'leave') {
    const k = t - g.a - g.dly, v = SPEED * eo(k / .5) ;
    const dist = k <= 0 ? 0 : SPEED * (k - .5 * .5 * 0 ) - SPEED * .5 * (1 - eo(1) ) ;
    x = stop + Math.max(0, k) * SPEED * sm(Math.min(1, Math.max(0, k) / .6) * .6 + .4 * (k > .6 ? 1 : 0)) ;
    x = stop + (k > 0 ? Math.max(0, SPEED * (k - .3 * (1 - eo(k / .6)))) : 0);
    walk = k > 0 ? sm(k / .5) : 0; ph = Math.abs(x - stop) / STRIDE;
    dir = k > -.15 && g.side === 'R' ? 1 : dir; if (g.side === 'R') dir = sm((k + .15) / .25) * 2 - 1;
    dir = g.side === 'R' ? (dir) * 1 : 1;
    tilt = g.nolook ? 0 : sm(1 - (t - g.a) / .6) * .6;
    if (g.side === 'L') dir = 1;
  } else { // hold: just before the first release
    x = stop; tilt = sm((t - g.a) / 1.2); arm = sm((t - g.a) / 1.7);
    arm = Math.min(arm, 1);
  }
  return { x, dir, walk, ph, tilt, arm, carry: g.carry, g };
}
function person(st) {
  const g = st.g, s = SPEC[g.sp], H = 330 * s.h, hip = -.46 * H, sh = -.78 * H, bw = s.bw * s.h;
  const sw = Math.sin(st.ph) * 26 * st.walk, lw = 24 * s.h, aw = 20 * s.h;
  const lean = st.tilt * (g.notice || 0) * 0; const bob = Math.abs(Math.sin(st.ph)) * 5 * st.walk;
  const fwd = st.tilt * 9, dn = st.tilt * 7;
  // carrying arm angle (deg, forward positive): hanging near the body, extends and lowers when "hold"
  let ca = 14 + st.arm * 26 + Math.sin(st.ph) * 6 * st.walk;
  const L = .36 * H, hx = Math.sin(ca * Math.PI / 180) * L, hy = sh + Math.cos(ca * Math.PI / 180) * L;
  let o = `<g transform="translate(${f(st.x)} ${GY}) scale(${f(st.dir)} 1)">`;
  o += `<ellipse cx="0" cy="4" rx="${f(.24 * H)}" ry="10" fill="#000" opacity=".12"/>`;
  o += `<g transform="translate(0 ${f(-bob)})">`;
  o += `<g transform="translate(0 ${f(sh)}) rotate(${f(st.carry ? 0 : sw * .9)})"><rect x="${-aw / 2}" y="0" width="${aw}" height="${f(.34 * H)}" rx="${aw / 2}" fill="${s.shirt}" opacity=".78"/></g>`;
  o += `<g transform="translate(-7 ${f(hip)}) rotate(${f(-sw)})"><rect x="${-lw / 2}" y="0" width="${lw}" height="${f(.46 * H)}" rx="${lw / 2}" fill="${s.pants}" opacity=".82"/></g>`;
  o += `<g transform="translate(7 ${f(hip)}) rotate(${f(sw)})"><rect x="${-lw / 2}" y="0" width="${lw}" height="${f(.46 * H)}" rx="${lw / 2}" fill="${s.pants}"/></g>`;
  o += `<g transform="rotate(${f(st.tilt * 3)} 0 ${f(hip)})"><rect x="${-bw / 2}" y="${f(-.80 * H)}" width="${bw}" height="${f(.36 * H)}" rx="${f(bw * .34)}" fill="${s.shirt}"/>`;
  const hxh = fwd, hyh = -.89 * H + dn, r = .085 * H;
  if (s.hair === 'long') o += `<ellipse cx="${f(hxh - 6)}" cy="${f(hyh + 8)}" rx="${f(r * 1.1)}" ry="${f(r * 1.5)}" fill="${s.hc}"/>`;
  if (s.hair === 'hood') o += `<circle cx="${f(hxh - 7)}" cy="${f(hyh + 8)}" r="${f(r * 1.25)}" fill="${s.hc}"/>`;
  o += `<circle cx="${f(hxh)}" cy="${f(hyh)}" r="${f(r)}" fill="${s.skin}"/>`;
  if (s.hair === 'short') o += `<path d="M${f(hxh - r)} ${f(hyh)}A${f(r)} ${f(r)} 0 0 1 ${f(hxh + r)} ${f(hyh)}L${f(hxh + r * .3)} ${f(hyh - r * .35)}L${f(hxh - r)} ${f(hyh - r * .2)}Z" fill="${s.hc}"/>`;
  if (s.hair === 'cap') o += `<path d="M${f(hxh - r)} ${f(hyh - r * .1)}A${f(r)} ${f(r)} 0 0 1 ${f(hxh + r)} ${f(hyh - r * .1)}Z" fill="${s.hc}"/><rect x="${f(hxh + r * .2)}" y="${f(hyh - r * .25)}" width="${f(r * 1.2)}" height="${f(r * .3)}" rx="3" fill="${s.hc}"/>`;
  o += `</g>`;
  o += `<g transform="translate(0 ${f(sh)}) rotate(${st.carry ? 0 : f(-sw * .9)})"><rect x="${-aw / 2}" y="0" width="${aw}" height="${f(.34 * H)}" rx="${aw / 2}" fill="${s.shirt}"/></g>`;
  if (st.carry) {
    const T = s.item, k = ({ bagBig: 1.05, bagSmall: 1.05, cup: 1, carton: 1, wrapper: 1, bottle: 1 })[T];
    o += `<g transform="translate(${f(hx)} ${f(hy)})"><g transform="translate(0 ${f(H_ITEM[T] * .8 * k)}) rotate(${f(Math.sin(st.ph * 1) * 5 * st.walk)} 0 ${f(-H_ITEM[T] * .8)}) scale(${k})">${item(T)}</g></g>`;
    o += `<g transform="translate(0 ${f(sh)}) rotate(${f(ca)})"><rect x="${-aw / 2}" y="0" width="${aw}" height="${f(L)}" rx="${aw / 2}" fill="${s.shirt}"/></g><circle cx="${f(hx)}" cy="${f(hy)}" r="${f(aw * .62)}" fill="${s.skin}"/>`;
  }
  o += `</g></g>`;
  return o;
}

// ---------- wide set ----------
function pileWide(n) {
  let o = '';
  for (let i = 0; i < n && i < ITEMS.length; i++) {
    const it = ITEMS[i];
    o += `<g transform="translate(${f(X0 + it.dx * SW)} ${f(GY - 24 - it.dy * SW)}) rotate(${it.rot}) scale(${SW})">${item(it.type)}</g>`;
  }
  return o;
}
function wideBG() {
  let o = `<rect width="1920" height="1080" fill="#e9e5dc"/>`;
  o += `<rect x="0" y="0" width="1450" height="700" fill="#d9d4c9"/><rect x="1450" y="0" width="470" height="700" fill="#c9c3b6"/>`;
  for (let i = 0; i < 4; i++) o += `<rect x="${150 + i * 330}" y="150" width="190" height="260" rx="6" fill="#b9c4c9" opacity=".75"/>`;
  o += `<rect x="1530" y="170" width="260" height="360" rx="6" fill="#aab5ba" opacity=".7"/>`;
  o += `<rect x="1446" y="0" width="8" height="700" fill="#bbb5a8"/>`;
  o += `<rect x="0" y="700" width="1920" height="40" fill="#cfc9bd"/>`; // curb
  o += `<rect x="0" y="740" width="1920" height="340" fill="#d6d1c6"/>`;
  for (let i = -2; i < 14; i++) o += `<line x1="${i * 170 + 40}" y1="740" x2="${i * 240 - 160}" y2="1080" stroke="#c4beb1" stroke-width="3"/>`;
  o += `<line x1="0" y1="900" x2="1920" y2="900" stroke="#c4beb1" stroke-width="3"/><line x1="0" y1="1000" x2="1920" y2="1000" stroke="#c4beb1" stroke-width="3"/>`;
  o += `<rect x="1136" y="150" width="10" height="560" fill="#8b8f93"/><rect x="1136" y="150" width="70" height="10" fill="#8b8f93"/><ellipse cx="1206" cy="170" rx="22" ry="9" fill="#f1ead2"/>`;
  return o;
}
function countAt(t) { return CLOSES.filter(c => c.land <= t).length; }
function wideCount(t) {
  if (t < 77) return countAt(t);
  if (t < 79.4) return Math.max(3, 9 - Math.floor((t - 77) / .4 + 1e-6));
  if (t < 81.2) return 3;           // (close-up reversed here)
  if (t < 81.6) return 2;
  if (t < 82.0) return 1;
  return 0;
}

// ---------- close-up ----------
function closeup(c, u, count) {
  const it = ITEMS[c.idx], T = it.type;
  let o = `<rect width="1920" height="1080" fill="#d3cec3"/>`;
  for (let i = -1; i < 6; i++) o += `<line x1="${i * 420 + 60}" y1="0" x2="${i * 420 + 60}" y2="1080" stroke="#bdb7aa" stroke-width="5"/>`;
  o += `<line x1="0" y1="330" x2="1920" y2="330" stroke="#bdb7aa" stroke-width="5"/><rect x="0" y="940" width="1920" height="140" fill="#c2bcaf"/>`;
  // earlier items
  for (let i = 0; i < c.idx; i++) { const e = ITEMS[i]; o += `<g transform="translate(${f(CX + e.dx * SC)} ${f(GYC - e.dy * SC)}) rotate(${e.rot}) scale(${SC})">${item(e.type)}</g>`; }
  const tx = CX + it.dx * SC, ty = GYC - it.dy * SC, hb = ty - 130, hh = H_ITEM[T] * SC * .8;
  const rel = c.desc + c.hes, uu = u - rel;
  let hy, holding = uu < 0, ix, iy, irot = 0, sx = 1, sy = 1;
  const hold = hb - hh;                     // hand y while holding
  if (u < c.desc) hy = -260 + (hold + 260) * eo(u / c.desc);
  else if (uu < 0) hy = hold - (c.hes > .5 ? 24 * Math.sin(Math.PI * cl((u - c.desc) / c.hes)) : 0);
  else hy = hold - 520 * ei((uu - .25) / .5);
  if (holding) { ix = tx; iy = hb; irot = Math.sin(u * 5) * 2; }
  else {
    const s = uu / FALL, gy = ty - hb;
    iy = uu < FALL ? hb + gy * s * s : ty - 14 * Math.sin(Math.PI * cl((uu - FALL) / .14)); ix = tx;
    irot = it.rot * cl(s); if (uu >= FALL && uu < FALL + .1) { sx = 1 + .1; sy = .9; }
  }
  o += `<g transform="translate(${f(ix)} ${f(iy)}) rotate(${f(irot)}) scale(${f(SC * sx)} ${f(SC * sy)})">${item(T)}</g>`;
  const hx = tx, aw = 150;
  o += `<rect x="${f(hx - aw / 2)}" y="-100" width="${aw}" height="${f(hy + 100)}" rx="60" fill="${c.shirt}"/>`;
  o += `<ellipse cx="${f(hx)}" cy="${f(hy + 20)}" rx="64" ry="58" fill="${c.skin}"/><rect x="${f(hx - 74)}" y="${f(hy - 10)}" width="30" height="64" rx="15" fill="${c.skin}" transform="rotate(-18 ${f(hx - 60)} ${f(hy + 20)})"/>`;
  return o;
}

// ---------- compose ----------
function frame(t) {
  if (t >= 87.0) {
    let o = `<rect width="1920" height="1080" fill="#000"/>`;
    const a = sm((t - 87.6) / .6);
    o += `<g opacity="${f(a)}" fill="#f3efe6" text-anchor="middle"><text x="960" y="520" font-size="70" font-weight="700" letter-spacing="3">AND THEN IT ALL BECOMES NORMAL?</text><text x="960" y="620" font-size="34" letter-spacing="10" opacity=".8">THE 1ST THROW</text></g>`;
    return o;
  }
  const C = CLOSES.find(c => t >= c.a && t < c.b);
  if (C) return closeup(C, t - C.a);
  const R = REV.find(r => t >= r.a && t < r.b);
  if (R) { const c = CLOSES[R.src === 0 ? 0 : 2], d = R.b - R.a; return closeup(c, Math.max(0, Math.min(c.b - c.a, (R.b - t))) * ((c.b - c.a) > d ? 1 : 1), 0); }
  let o = wideBG() + pileWide(wideCount(t));
  for (const g of SEGS) if (t >= g.a && t < g.b) o += person(personState(g, t));
  return o;
}
let lastT = -1;
window.seek = t => { S.innerHTML = frame(t); };

// ---------- audio (synthesised placeholders, no files) ----------
window.buildAudio = async ctx => {
  const sr = ctx.sampleRate, noise = (dur, lp) => { const b = ctx.createBuffer(1, Math.ceil(dur * sr), sr), d = b.getChannelData(0); let y = 0, s = 12345; for (let i = 0; i < d.length; i++) { s = (s * 1664525 + 1013904223) >>> 0; const w = (s / 4294967296) * 2 - 1; y += (w - y) * lp; d[i] = y; } return b; };
  const play = (buf, at, g, fq) => { const s = ctx.createBufferSource(), gn = ctx.createGain(), fl = ctx.createBiquadFilter(); s.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = fq || 8000; gn.gain.value = g; s.connect(fl); fl.connect(gn); gn.connect(ctx.destination); s.start(at); };
  // ambience: low wind/traffic, fades toward silence in scene 11, gone before the end
  const amb = ctx.createBufferSource(), ag = ctx.createGain(); amb.buffer = noise(87, .02); amb.connect(ag); ag.connect(ctx.destination);
  ag.gain.setValueAtTime(.35, 0); ag.gain.setValueAtTime(.35, 66); ag.gain.linearRampToValueAtTime(.03, 77); ag.gain.linearRampToValueAtTime(0, 83.5); amb.start(0);
  const step = noise(.12, .25), thump = noise(.4, .08);
  for (const g of SEGS) { // footsteps while someone walks in a wide shot
    if (g.mode === 'hold') continue;
    let prev = Math.sin(personState(g, g.a).ph);
    for (let t = g.a; t < g.b; t += .01) { const st = personState(g, t), s = Math.sin(st.ph); if (st.walk > .3 && prev * s < 0) play(step, t, .22 * st.walk, 1400); prev = s; }
  }
  for (const c of CLOSES) { play(thump, c.land, c.idx === 0 ? .9 : .6, 700); play(step, c.land + .02, .25, 2500); }
  // reverse: soft withdrawn thumps
  play(thump, 80.2, .25, 500); play(thump, 82.9, .3, 500);
};
seek(0);
</script>
