  cPileVec.innerHTML = pv_;
  cFG.innerHTML = drawHand(C0, hx2 + (grip < 1 ? 0 : 0), hy2, grip, C0.ch, C0.side === 'L' ? 'L' : 'R', E);
}

// ---------------- compose ----------------
const REVW = [[77, 78.2, 62.39, 60.2], [78.2, 79.2, 56.39, 54.4], [79.2, 80.0, 53.59, 52.6], [80.0, 80.4, 50.5, 50.5], [80.4, 80.8, 42.9, 42.9], [80.8, 81.4, 21.4, 21.4], [81.4, 83.0, 14.99, 12.0], [83.0, 87.0, 11.95, 11.95]];
function mapT(T) { if (T < 77) return T; for (const [a, b, f0, f1] of REVW) if (T < b) return lerp(f0, f1, (T - a) / (b - a)); return 11.95; }
function frameAt(T) {
  if (T >= 87) {
    gWide.setAttribute('display', 'none'); gClose.setAttribute('display', 'none'); gEnd.setAttribute('display', '');
    gEnd.innerHTML = `<rect width="1920" height="1080" fill="#000"/><g opacity="${f(sm((T - 87.6) / .6))}" fill="#f3efe6" text-anchor="middle"><text x="960" y="520" font-size="70" font-weight="700" letter-spacing="3">AND THEN IT ALL BECOMES NORMAL?</text><text x="960" y="620" font-size="34" letter-spacing="10" opacity=".8">THE 1ST THROW</text></g>`;
    return;
  }
  const t = mapT(T), C0 = CLOSES.find(c => t >= c.a && t < c.b);
  if (C0) drawClose(t, C0); else drawWide(t);
}
buildBG(); buildChars();
const imgs = [...document.querySelectorAll('image')];
Promise.all([...new Set(imgs.map(i => i.getAttribute('href')))].map(src => { const im = new Image(); im.src = src; return im.decode().catch(() => {}); })).then(() => {
  window.seek = T => frameAt(T); window.seek(0);
});

// ---------------- audio (synthesised placeholders; swap for real foley) ----------------
window.buildAudio = async ctx => {
  const sr = ctx.sampleRate, noise = (dur, lp) => { const b = ctx.createBuffer(1, Math.ceil(dur * sr), sr), d = b.getChannelData(0); let y = 0, s = 12345; for (let i = 0; i < d.length; i++) { s = (s * 1664525 + 1013904223) >>> 0; y += ((s / 4294967296) * 2 - 1 - y) * lp; d[i] = y; } return b; };
  const rev = b => { const o = ctx.createBuffer(1, b.length, sr), a = b.getChannelData(0), d = o.getChannelData(0); for (let i = 0; i < a.length; i++) d[i] = a[a.length - 1 - i]; return o; };
  const play = (buf, at, g, fq) => { const s = ctx.createBufferSource(), gn = ctx.createGain(), fl = ctx.createBiquadFilter(); s.buffer = buf; fl.type = 'lowpass'; fl.frequency.value = fq || 8000; gn.gain.value = g; s.connect(fl); fl.connect(gn); gn.connect(ctx.destination); s.start(at); };
  const amb = ctx.createBufferSource(), ag = ctx.createGain(); amb.buffer = noise(88, .02); amb.connect(ag); ag.connect(ctx.destination);
  ag.gain.setValueAtTime(.3, 0); ag.gain.setValueAtTime(.3, 66); ag.gain.linearRampToValueAtTime(.03, 77); ag.gain.linearRampToValueAtTime(0, 82.5); amb.start(0);
  const step = noise(.12, .25), heavy = noise(.45, .07), tick = noise(.2, .3), cloth = noise(.25, .05);
  const inClose = t => CLOSES.some(c => t >= c.a && t < c.b);
  for (const g of SEGS) { let prev = Math.sin(pState(g, g.a).ph);
    for (let t = g.a; t < g.b; t += .01) { const st = pState(g, t), s = Math.sin(st.ph); if (st.amp > .25 && prev * s < 0 && !inClose(t) && t < 77) play(step, t, .2 * st.amp, 1400); prev = s; } }
  ITEMS.forEach((it, i) => { if (it.amb) return; const k = ITEM_KIND[i]; const b = k === 'heavy' ? heavy : tick, gain = k === 'heavy' ? .85 : k === 'wrap' ? .15 : .5;
    play(b, it.land, gain, k === 'heavy' ? 650 : 2600); play(cloth, it.tr, .12, 900);
    // reversed impact in the rewind: matches where the item leaves the ground again
    for (const [a, bb, f0, f1] of REVW) { const lo = Math.min(f0, f1), hi = Math.max(f0, f1); if (f0 !== f1 && it.land >= lo && it.land <= hi) { const T = a + (it.land - f0) / (f1 - f0) * (bb - a); play(rev(b), T - .4, gain * .45, k === 'heavy' ? 650 : 2600); } } });
};
